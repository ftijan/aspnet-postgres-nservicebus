services:
  postgres:
    image: postgres:18
    container_name: local-postgres
    # Change these environment variables (and use a .env file or secrets) before using outside local development
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: sample_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d sample_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: